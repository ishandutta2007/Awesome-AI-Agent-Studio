<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 12px #a855f7); }
    }
    @keyframes dashLine {
      to { stroke-dashoffset: -40; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes textGlow {
      0%, 100% { filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.4)); }
      50% { filter: drop-shadow(0 0 25px rgba(99, 102, 241, 0.7)); }
    }

    .bg-path { fill: url(#bgGlow); }
    .title-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 52px; fill: #ffffff; animation: textGlow 6s ease-in-out infinite; }
    .subtitle-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 13px; fill: #38bdf8; letter-spacing: 1.5px; text-transform: uppercase; }
    
    .animated-line { stroke: url(#accentGrad1); stroke-width: 2; stroke-dasharray: 8 6; animation: dashLine 3s linear infinite; opacity: 0.5; }
    .animated-node { animation: pulseNode 4s ease-in-out infinite; transform-origin: center; }
    .particle { animation: floatParticle 5s ease-in-out infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" rx="16" class="bg-path" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08">
    <path d="M 0 50 L 1200 50 M 0 100 L 1200 100 M 0 150 L 1200 150 M 0 200 L 1200 200 M 0 250 L 1200 250 M 0 300 L 1200 300 M 0 350 L 1200 350" stroke="#ffffff" stroke-width="1"/>
    <path d="M 100 0 L 100 400 M 200 0 L 200 400 M 300 0 L 300 400 M 400 0 L 400 400 M 500 0 L 500 400 M 600 0 L 600 400 M 700 0 L 700 400 M 800 0 L 800 400 M 900 0 L 900 400 M 1000 0 L 1000 400 M 1100 0 L 1100 400" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Dynamic Animated Node Network in Background -->
  <g opacity="0.6">
    <!-- Connecting Workflow Lines -->
    <path d="M 150 80 Q 300 160 450 90 T 800 120 T 1050 70" class="animated-line" fill="none"/>
    <path d="M 100 320 Q 350 240 600 330 T 950 280 T 1120 340" class="animated-line" fill="none" style="animation-duration: 4.5s;"/>

    <!-- Glowing Nodes -->
    <circle cx="150" cy="80" r="6" fill="#a855f7" class="animated-node"/>
    <circle cx="450" cy="90" r="8" fill="#6366f1" class="animated-node" style="animation-delay: 1s;"/>
    <circle cx="800" cy="120" r="7" fill="#ec4899" class="animated-node" style="animation-delay: 2s;"/>
    <circle cx="1050" cy="70" r="5" fill="#38bdf8" class="animated-node" style="animation-delay: 0.5s;"/>

    <circle cx="100" cy="320" r="7" fill="#10b981" class="animated-node" style="animation-delay: 1.5s;"/>
    <circle cx="600" cy="330" r="9" fill="#a855f7" class="animated-node" style="animation-delay: 2.5s;"/>
    <circle cx="950" cy="280" r="6" fill="#3b82f6" class="animated-node" style="animation-delay: 3s;"/>
  </g>

  <!-- Background Floating Particles -->
  <g class="particle" style="animation-delay: 0.2s;"><circle cx="200" cy="180" r="3" fill="#6366f1" opacity="0.6"/></g>
  <g class="particle" style="animation-delay: 1.2s;"><circle cx="1000" cy="220" r="4" fill="#a855f7" opacity="0.5"/></g>
  <g class="particle" style="animation-delay: 2.1s;"><circle cx="850" cy="60" r="3" fill="#ec4899" opacity="0.7"/></g>
  <g class="particle" style="animation-delay: 3.4s;"><circle cx="150" cy="250" r="4" fill="#38bdf8" opacity="0.6"/></g>

  <!-- Central Foreground Content Card Container -->
  <rect x="180" y="60" width="840" height="280" rx="20" fill="url(#cardGrad)" stroke="url(#accentGrad1)" stroke-width="1.5" style="backdrop-filter: blur(10px);"/>

  <!-- Top Pill / Badge -->
  <rect x="440" y="95" width="320" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="600" y="116" text-anchor="middle" class="badge-text">⚡ AI AGENT ECOSYSTEM DIRECTORY</text>

  <!-- Main Title -->
  <text x="600" y="190" text-anchor="middle" class="title-text">Awesome AI Agent Studio 🤖</text>

  <!-- Subtitle -->
  <text x="600" y="235" text-anchor="middle" class="subtitle-text">Curated List of Commercial Agent Studios &amp; Open-Source Visual Builders</text>

  <!-- Bottom Tech Tags -->
  <g text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">
    <rect x="340" y="270" width="150" height="28" rx="14" fill="#334155" opacity="0.8"/>
    <text x="415" y="289">🏢 Enterprise SaaS</text>

    <rect x="505" y="270" width="190" height="28" rx="14" fill="#334155" opacity="0.8"/>
    <text x="600" y="289">🔓 Open-Source Frameworks</text>

    <rect x="710" y="270" width="150" height="28" rx="14" fill="#334155" opacity="0.8"/>
    <text x="785" y="289">🎨 Visual Builders</text>
  </g>

  <!-- Decorative Outer Border Glow -->
  <rect x="2" y="2" width="1196" height="396" rx="15" fill="none" stroke="url(#accentGrad1)" stroke-width="2" opacity="0.5"/>
</svg>
